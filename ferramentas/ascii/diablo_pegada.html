<!doctype html>
<html lang="pt-br"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cavaleiro · ASCII sombrio</title>
<style>
html,body{margin:0;background:#050403;color:#8d8372;font-family:system-ui,sans-serif}
#quadro{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px}
canvas{width:min(100vw,1200px);height:auto;background:#050403;image-rendering:pixelated;border:1px solid #1d1812}
small{opacity:.75;font-size:12px;text-align:center}
</style></head><body><div id="quadro"><canvas id="c"></canvas>
<small>Setas ou WASD andam · espaço ataca · a tocha segue o cavaleiro</small></div>
<script>
// ================= cena em caracteres: masmorra escura, luz de tocha, cavaleiro de armadura =================
const COLS = 112, LIN = 40, CW = 11, CH = 18;
const cv = document.getElementById("c"); cv.width = COLS * CW; cv.height = LIN * CH;
const ctx = cv.getContext("2d");
ctx.font = "17px 'DejaVu Sans Mono', Menlo, Consolas, monospace"; ctx.textBaseline = "top";

function hash(x, y, s = 0) { let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
function ruido(x, y, escala, s = 0) {
  const gx = x / escala, gy = y / escala, ix = Math.floor(gx), iy = Math.floor(gy), fx = gx - ix, fy = gy - iy;
  const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
  const a = hash(ix, iy, s), b = hash(ix + 1, iy, s), c = hash(ix, iy + 1, s), d = hash(ix + 1, iy + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}

// ---------- cenário: piso de lajes, parede de tijolos ao fundo, pilares ----------
const PAREDE = 8;                      // linhas de parede no topo
const chao = [];                       // célula: {g, r, g2, b, base}
const MUSGO = [".", ",", "'", "`", ":", ";", "\"", "-", "~"];
for (let y = 0; y < LIN; y++) {
  chao[y] = [];
  for (let x = 0; x < COLS; x++) {
    let g = " ", cor = [40, 40, 30];
    if (y < PAREDE) {                  // parede: tijolos
      const fiada = y % 3 === 0, desloc = (Math.floor(y / 3) % 2) * 6;
      const juntaV = ((x + desloc) % 12 === 0) && !fiada;
      g = fiada ? "▒" : juntaV ? "▒" : (hash(x, y) < 0.5 ? "▓" : "█");
      const t = ruido(x, y, 5, 3);
      cor = fiada || juntaV ? [34, 31, 28] : [78 + t * 30, 66 + t * 26, 56 + t * 22];
    } else {                           // piso: lajes irregulares com musgo e rachaduras
      const fy = y - PAREDE, linhaLaje = fy % 6 === 0;
      const desloc = (Math.floor(fy / 6) * 7 + Math.floor(hash(Math.floor(fy / 6), 5) * 9)) % 16;
      const juntaV = ((x + desloc) % 16 === 0);
      const t = ruido(x, y, 7, 1), m = ruido(x, y, 4, 2);
      if (linhaLaje) { g = "_"; cor = [30, 28, 22]; }
      else if (juntaV) { g = "|"; cor = [32, 29, 23]; }
      else {
        const r = hash(x, y, 9);
        g = r < 0.22 ? MUSGO[Math.floor(hash(x, y, 4) * MUSGO.length)] : r < 0.30 ? "·" : " ";
        cor = [78 + t * 42, 74 + t * 36, 56 + t * 26];
        if (m > 0.62) cor = [52 + m * 20, 86 + m * 34, 44 + m * 12];      // musgo esverdeado
        if (hash(x, y, 7) > 0.985) { g = "o"; cor = [96, 90, 76]; }        // pedrinhas
      }
    }
    chao[y][x] = { g, cor };
  }
}
const PILARES = [14, 52, 94];
function pilar(x, y) {                 // devolve {g,cor} se o ponto pertence a um pilar
  for (const px of PILARES) {
    if (x >= px && x < px + 6 && y >= 4 && y < 17) {
      const dx = x - px;
      if (y >= 15) return { g: "▀▀▀▀▀▀"[dx], cor: [92, 84, 72] };
      if (y <= 5) return { g: "▄▄▄▄▄▄"[dx], cor: [96, 88, 76] };
      const claro = [1, 1, 0.8, 0.6, 0.4, 0.25][dx];
      return { g: ["▐", "█", "█", "▓", "▒", "▌"][dx], cor: [128 * claro + 20, 118 * claro + 18, 100 * claro + 14] };
    }
  }
  return null;
}
const BRASEIROS = [[33, 15], [74, 15]];           // luz fixa, laranja

// ---------- cavaleiro (13x10) ----------
const FRENTE = [
  "     ▄▄▄     ",
  "    ▟███▙    ",
  "    ▐▬▬▬▌    ",
  "  ▟██▀▀▀██▙  ",
  " ▐███▓◈▓███▌ ",
  " ▐█▌▓▓▓▓▓▐█▌ ",
  "   ▐▓▓▓▓▓▌   ",
  "   ▐█▌ ▐█▌   ",
  "   ▐█▌ ▐█▌   ",
  "  ▄██▌ ▐██▄  "];
const COSTAS = [
  "     ▄▄▄     ",
  "    ▟███▙    ",
  "    ▐███▌    ",
  "  ▟██▀▀▀██▙  ",
  " ▐████▒████▌ ",
  " ▐█▌▒▒▒▒▒▐█▌ ",
  "   ▐▒▒▒▒▒▌   ",
  "   ▐█▌ ▐█▌   ",
  "   ▐█▌ ▐█▌   ",
  "  ▄██▌ ▐██▄  "];
const LADO = [   // olhando para a direita
  "      ▄▄▄    ",
  "     ▟██▙    ",
  "     ▐█▬▌    ",
  "    ▟███▙    ",
  "   ▐▓███▓▌   ",
  "   ▐▓▓█▓▓▌   ",
  "    ▐▓▓▓▌    ",
  "    ▐█▌█▌    ",
  "    ▐█▌█▌    ",
  "   ▄██▌██▄   "];
const PASSOS = {   // linhas 7-9 das pernas nos quadros de caminhada [aberto, fechado]
  frente: [["  ▐█▌   ▐█▌  ", "  ▐█▌   ▐█▌  ", " ▄██▌   ▐██▄ "], ["    ▐█▌▐█▌   ", "    ▐█▌▐█▌   ", "   ▄██▌▐██▄  "]],
  costas: [["  ▐█▌   ▐█▌  ", "  ▐█▌   ▐█▌  ", " ▄██▌   ▐██▄ "], ["    ▐█▌▐█▌   ", "    ▐█▌▐█▌   ", "   ▄██▌▐██▄  "]],
  lado: [["   ▐█▌  ▐█▌  ", "   ▐█▌  ▐█▌  ", "  ▄██▌  ▐██▄ "], ["     ▐██▌    ", "     ▐██▌    ", "    ▄███▄    "]]
};
const ESP = { "▬": [18, 18, 22], "◈": [210, 160, 60], "▲": [210, 220, 235], "║": [205, 212, 226], "╫": [190, 150, 70], "✺": [255, 90, 40], "◉": [255, 70, 50] };
const TRACO = { "░": 0.55, "▒": 0.4, "▓": 0.62, "█": 1, "▀": 0.9, "▄": 0.85, "▟": 0.95, "▙": 0.75, "▐": 0.9, "▌": 0.7, "▛": 0.9, "▜": 0.8 };

function corArmadura(g, x, y, largura) {
  const t = x / (largura - 1), luz = 1 - 0.75 * t;           // luz vem da esquerda
  const f = (TRACO[g] ?? 0.7) * (0.55 + 0.55 * luz) * (1 - y * 0.022);
  let c = [62 + 110 * f, 70 + 112 * f, 84 + 112 * f];
  if (g === "▓" || g === "▒") c = [c[0] * 0.55, c[1] * 0.55, c[2] * 0.6];
  if (y === 3 && (g === "▀")) c = [150, 112, 54];             // detalhe de bronze nas ombreiras
  return c;
}

const heroi = { x: 56, y: 30, dir: "frente", passo: 0, ataque: -1, tAtaque: 0, andou: 0 };
function sprite() {
  const base = heroi.dir === "costas" ? COSTAS : (heroi.dir === "frente" ? FRENTE : LADO);
  const linhas = base.slice();
  if (heroi.andou > 0) {
    const p = PASSOS[heroi.dir === "esquerda" || heroi.dir === "direita" ? "lado" : heroi.dir][heroi.passo % 2];
    for (let i = 0; i < 3; i++) linhas[7 + i] = p[i];
  }
  const cel = linhas.map(l => l.split("").map(g => ({ g, esp: null })));
  const larg = 13;
  const ponha = (y, x, g) => { if (y >= 0 && y < 10 && x >= 0 && x < larg) cel[y][x] = { g, esp: g }; };
  const frente = heroi.dir === "frente" || heroi.dir === "costas";
  const lx = heroi.dir === "costas" ? 11 : 1;                   // espada erguida do lado da mão
  if (frente) {
    const levantada = [[0, "▲"], [1, "║"], [2, "║"], [3, "║"], [4, "╫"]];
    if (heroi.ataque === 0) levantada.forEach(([y, g]) => ponha(y, lx, g));
    else if (heroi.ataque === 1) { for (let k = 0; k < 6; k++) ponha(4 + (k > 2 ? 1 : 0), lx + (heroi.dir === "costas" ? -k : k), k === 5 ? "▶" : "═"); ponha(3, lx + 3, "▒"); ponha(3, lx + 4, "░"); }
    else if (heroi.ataque === 2) { [[5, "╫"], [6, "║"], [7, "║"], [8, "▼"]].forEach(([y, g]) => ponha(y, lx + (heroi.dir === "costas" ? -3 : 3), g)); }
    else levantada.forEach(([y, g]) => ponha(y, lx, g));
  } else {
    const baixo = heroi.ataque < 0 || heroi.ataque === 0;
    if (heroi.ataque === 1) { for (let k = 0; k < 5; k++) ponha(5, 8 + k, k === 4 ? "▶" : "═"); ponha(4, 10, "▒"); ponha(4, 11, "░"); }
    else if (heroi.ataque === 2) [[6, "╫"], [7, "║"], [8, "▼"]].forEach(([y, g]) => ponha(y, 10, g));
    else if (baixo) [[1, "▲"], [2, "║"], [3, "║"], [4, "╫"]].forEach(([y, g]) => ponha(y, 10, g));
  }
  if (heroi.dir === "esquerda") for (const l of cel) { l.reverse(); for (const c of l) c.g = ({ "▐": "▌", "▌": "▐", "▟": "▙", "▙": "▟", "▶": "◀", "▛": "▜", "▜": "▛" })[c.g] ?? c.g; }
  return cel;
}

// ---------- iluminação ----------
function luz(x, y, t) {
  const cintil = 1 + 0.10 * Math.sin(t * 9) + 0.07 * Math.sin(t * 23 + 1) + 0.05 * (hash(Math.floor(t * 14), 3) - 0.5);
  let r = 0, g = 0, b = 0;
  const fontes = [[heroi.x, heroi.y - 4, 17 * (heroi.ataque >= 0 ? 1.25 : 1), 1]];
  for (const [bx, by] of BRASEIROS) fontes.push([bx, by, 13, 0.85]);
  fontes.forEach(([lx, ly, raio, forca], i) => {
    const dx = (x - lx) * 0.6, dy = y - ly, d = Math.sqrt(dx * dx + dy * dy * 1.45);
    let v = Math.max(0, 1 - d / (raio * 0.62)); v = Math.pow(v, 1.55) * forca * (i === 0 ? cintil : cintil * (1.03 + 0.1 * Math.sin(t * 7 + i * 3)));
    r += v * 1.0; g += v * 0.66; b += v * 0.36;
  });
  if (heroi.ataque === 1) { const d = Math.hypot((x - heroi.x) * 0.6, y - heroi.y + 3); const v = Math.max(0, 1 - d / 9) * 0.6; r += v; g += v * 0.15; b += v * 0.08; }
  return [Math.min(r + 0.045, 1.4), Math.min(g + 0.04, 1.3), Math.min(b + 0.05, 1.2)];
}

function desenhar(t) {
  ctx.fillStyle = "#050403"; ctx.fillRect(0, 0, cv.width, cv.height);
  const spr = sprite();
  const ox = heroi.x - 6, oy = heroi.y - 9;
  for (let y = 0; y < LIN; y++) for (let x = 0; x < COLS; x++) {
    let c = chao[y][x], g = c.g, cor = c.cor;
    const p = pilar(x, y); if (p) { g = p.g; cor = p.cor; }
    for (const [bx, by] of BRASEIROS) {         // braseiro: bacia e chamas animadas
      if (y === by + 1 && x >= bx - 2 && x <= bx + 2) { g = "▀▄█▄▀"[x - bx + 2]; cor = [70, 62, 52]; }
      if (y >= by - 3 && y <= by && Math.abs(x - bx) <= 2 - (by - y) * 0.6) {
        const k = hash(x, y, Math.floor(t * 9)); g = k < 0.45 ? "^" : k < 0.75 ? "*" : "'"; cor = [255, 130 + k * 100, 30 + k * 40]; }
    }
    // sombra do cavaleiro no chão
    if (y === heroi.y + 1 && Math.abs(x - heroi.x) <= 5) { g = "▒"; cor = [20, 18, 14]; }
    const sx = x - ox, sy = y - oy;
    let emissivo = false;
    if (sx >= 0 && sx < 13 && sy >= 0 && sy < 10) {
      const e = spr[sy][sx];
      if (e.g !== " ") {
        g = e.g;
        if (e.esp && ESP[e.esp]) { cor = ESP[e.esp]; emissivo = (e.esp === "✺" || e.esp === "◉"); }
        else if (e.esp === "═" || e.esp === "▶" || e.esp === "◀" || e.esp === "▼") { cor = [210, 216, 228]; }
        else if (e.esp === "▒" || e.esp === "░") { cor = [255, 190, 110]; emissivo = true; }
        else cor = corArmadura(g, sx, sy, 13);
      }
    }
    if (g === " ") continue;
    let [lr, lg, lb] = luz(x, y, t);
    if (y < PAREDE) { lr *= 0.9; lg *= 0.85; lb *= 0.8; }
    let R = cor[0] * lr, G = cor[1] * lg, B = cor[2] * lb;
    if (g === "^" || g === "*" || (g === "'" && y >= 12 && y <= 16)) { R = cor[0]; G = cor[1]; B = cor[2]; }
    if (emissivo) { R = cor[0]; G = cor[1]; B = cor[2]; }
    if (R + G + B < 14) continue;
    ctx.fillStyle = `rgb(${Math.min(255, R) | 0},${Math.min(255, G) | 0},${Math.min(255, B) | 0})`;
    ctx.fillText(g, x * CW, y * CH);
  }
}

// ---------- entrada e laço ----------
const teclas = new Set();
const MAPA = { ArrowUp: "costas", w: "costas", ArrowDown: "frente", s: "frente", ArrowLeft: "esquerda", a: "esquerda", ArrowRight: "direita", d: "direita" };
addEventListener("keydown", e => { const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  if (MAPA[k]) { teclas.add(k); e.preventDefault(); }
  if (k === " " && heroi.ataque < 0) { heroi.ataque = 0; heroi.tAtaque = performance.now(); e.preventDefault(); } });
addEventListener("keyup", e => { teclas.delete(e.key.length === 1 ? e.key.toLowerCase() : e.key); });
let ultimoPasso = 0;
function passo(agora) {
  if (heroi.ataque >= 0 && agora - heroi.tAtaque > 110) { heroi.ataque++; heroi.tAtaque = agora; if (heroi.ataque > 3) heroi.ataque = -1; }
  if (heroi.ataque < 0 && agora - ultimoPasso > 85) {
    let dx = 0, dy = 0, d = null;
    for (const k of teclas) { d = MAPA[k]; if (d === "esquerda") dx = -2; if (d === "direita") dx = 2; if (d === "costas") dy = -1; if (d === "frente") dy = 1; }
    if (dx || dy) { heroi.dir = d; heroi.x = Math.max(9, Math.min(COLS - 10, heroi.x + dx)); heroi.y = Math.max(PAREDE + 11, Math.min(LIN - 2, heroi.y + dy)); heroi.passo++; heroi.andou = 6; ultimoPasso = agora; }
    else if (heroi.andou > 0) heroi.andou--;
  }
}
// pequena demonstração automática até o jogador mexer: anda em círculo e ataca de vez em quando
let jogador = false; addEventListener("keydown", () => jogador = true);
const roteiro = [["direita", 14], ["frente", 3], ["esquerda", 14], ["costas", 3]]; let rIdx = 0, rCont = 0, rPausa = 0;
function demo(agora) {
  if (jogador || heroi.ataque >= 0) return;
  if (rPausa > 0) { rPausa--; return; }
  if (agora - ultimoPasso < 110) return;
  const [d, n] = roteiro[rIdx]; heroi.dir = d; heroi.andou = 6; heroi.passo++; ultimoPasso = agora;
  heroi.x = Math.max(9, Math.min(COLS - 10, heroi.x + (d === "direita" ? 2 : d === "esquerda" ? -2 : 0)));
  heroi.y = Math.max(PAREDE + 11, Math.min(LIN - 2, heroi.y + (d === "frente" ? 1 : d === "costas" ? -1 : 0)));
  if (++rCont >= n) { rCont = 0; rIdx = (rIdx + 1) % roteiro.length; if (rIdx % 2 === 0) { heroi.ataque = 0; heroi.tAtaque = agora; } }
}
function laco(agora) { passo(agora); demo(agora); desenhar(agora / 1000); requestAnimationFrame(laco); }
requestAnimationFrame(laco);
</script></body></html>
