# Servidor online do AlgoLand no Fly.io, em São Paulo: presença nos mapas, chat global e duelo.
# Uso: fly apps create algoland-duelo && fly deploy   (nesta pasta)
app = "algoland-duelo"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  PORTA = "8787"
  # Painel administrativo só na rede privada da conta (não está no http_service, então não é público).
  # No PC: ./abrir_painel_fly.sh abre o túnel `fly proxy` e o painel ligado a ele.
  ADMIN_PORTA = "8788"
  ADMIN_HOST = "fly-local-6pn"

[http_service]
  internal_port = 8787
  force_https = true
  # Sempre uma máquina ligada: desligar por inatividade faria a primeira conexão do duelo demorar.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 150
    hard_limit = 200

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/saude"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
